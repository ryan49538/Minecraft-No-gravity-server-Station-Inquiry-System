<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無重力空間伺服器車站查詢系統 v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        .tech-font { font-family: 'Share Tech Mono', monospace; }
        .neon-border { box-shadow: 0 0 15px rgba(6, 182, 212, 0.2), inset 0 0 15px rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.4); }
        .neon-text-cyan { text-shadow: 0 0 8px rgba(6, 182, 212, 0.8); }
        .grid-bg { background-color: #030712; background-image: linear-gradient(rgba(6, 182, 212, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(6, 182, 212, 0.05) 1px, transparent 1px); background-size: 20px 20px; }
        .scanline { background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0, 242, 254, 0.04) 50%, rgba(0, 242, 254, 0.04)); background-size: 100% 4px; }
    </style>
</head>
<body class="grid-bg scanline text-slate-200 min-h-screen p-4 md:p-8 tech-font">

    <div class="max-w-6xl mx-auto space-y-6">
        <header class="neon-border bg-slate-950/80 p-6 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-cyan-400 tracking-wider neon-text-cyan">🌌 無重力空間伺服器車站查詢系統</h1>
                <p class="text-xs text-cyan-600 mt-1">Operator: ryan49538</p>
            </div>
            <span class="text-xs text-cyan-700 font-bold border border-cyan-800 px-2 py-1 rounded">v3.0</span>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-5 space-y-6">
                <div class="neon-border bg-slate-950/80 p-6 rounded-2xl space-y-4">
                    <h2 class="text-lg font-semibold text-cyan-300 border-b border-slate-800 pb-2">📡 1. 設定引力座標</h2>
                    
                    <div>
                        <label class="block text-xs text-cyan-400 mb-1">🎮 貼上指令</label>
                        <input type="text" id="commandInput" placeholder="請先使用 F3+C 複製指令" oninput="parseCommandToInputs()" class="w-full bg-slate-900 border border-slate-700 focus:border-cyan-400 focus:outline-none rounded-lg p-2 text-xs text-slate-300 font-mono">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-cyan-400 mb-1">X 軸</label>
                            <input type="number" id="userX" oninput="syncInputToCommand(); calculateNearest();" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-center text-cyan-400 font-bold" placeholder="0">
                            <label class="flex items-center mt-2 text-xs text-slate-400 cursor-pointer"><input type="checkbox" id="negX" onchange="syncInputToCommand(); calculateNearest();" class="mr-2"> 設定為負數</label>
                        </div>
                        <div>
                            <label class="block text-xs text-cyan-400 mb-1">Z 軸</label>
                            <input type="number" id="userZ" oninput="syncInputToCommand(); calculateNearest();" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-center text-cyan-400 font-bold" placeholder="0">
                            <label class="flex items-center mt-2 text-xs text-slate-400 cursor-pointer"><input type="checkbox" id="negZ" onchange="syncInputToCommand(); calculateNearest();" class="mr-2"> 設定為負數</label>
                        </div>
                    </div>
                    <button onclick="calculateNearest()" class="w-full p-3 bg-cyan-950/80 border border-cyan-500 rounded-xl font-bold text-cyan-400 hover:bg-cyan-900 transition-all">⚡ 執行定位計算</button>
                </div>
                
                <div class="neon-border bg-slate-950/80 p-6 rounded-2xl">
                    <h2 class="text-lg font-semibold text-cyan-300 border-b border-slate-800 pb-2">🚀 2. 車站詳細資訊</h2>
                    <div id="detailsBox" class="mt-4 p-4 bg-cyan-950/30 border border-cyan-800/50 rounded-xl text-slate-300 text-sm space-y-1">
                        <div id="nearestName" class="text-xl font-bold text-white mb-1">-</div>
                        <div class="text-cyan-400 font-bold mb-2">直線距離：<span id="distDisplay">0</span> 公尺</div>
                        <div id="detailsContent">請先定位以顯示車站資訊。</div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-7">
                <div class="neon-border bg-slate-950/80 p-6 rounded-2xl">
                    <h2 class="text-lg font-semibold text-cyan-300 mb-4">🛰️ 空間星圖</h2>
                    <div class="relative w-full aspect-square max-w-[500px] mx-auto bg-slate-950 rounded-2xl border border-slate-800/80 overflow-hidden">
                        <div class="absolute top-3 left-3 bg-slate-900/90 border border-slate-700/80 px-3 py-2 rounded-lg text-xs space-y-2 z-10 pointer-events-none">
                            <div class="text-slate-400 font-semibold">圖例說明</div>
                            <div class="flex items-center gap-2">
                                <span class="w-4 h-1 bg-blue-900 inline-block rounded"></span>
                                <span class="text-slate-300">無重力鐵路主線</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="w-4 h-1 bg-red-600 inline-block rounded"></span>
                                <span class="text-slate-300">捷運陳傑線</span>
                            </div>
                        </div>
                        <canvas id="mapCanvas" class="w-full h-full"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const stations = {
            "創世車站": { x: -500, z: -100, info: "車站位置_-500 68 -100<br>所屬路線_鐵路創世線<br>車站編號_1000<br>車站等級_特等站<br>月台形式_島式月台一座<br>下行車站_大洋<br>啟用日期_2026.7.11<br>車站歷史：<br>2026年7月11日 設創世特等站<br>2026年7月11日 鐵路創世線通車經過創世站" },
            "大洋車站": { x: -461, z: 109, info: "車站位置_-461 63 109<br>所屬路線_鐵路創世線<br>車站編號_1010<br>車站等級_招呼站（由創世站管理）<br>月台形式_岸壁式月台（側式月台）二座<br>上行車站_創世<br>下行車站_關山<br>啟用日期_2026.7.11<br>車站歷史：<br>2026年7月11日 設大洋招呼站<br>2026年7月11日 鐵路創世線通車經過大洋站" },
            "關山車站": { x: -336, z: 1148, info: "車站位置_-336 71 1148<br>所屬路線_鐵路創世線<br>車站編號_1020<br>車站等級_甲種簡易站<br>月台形式_島式月台一座<br>上行車站_大洋<br>下行車站_沙崙<br>啟用日期_2026.7.12<br>車站歷史：<br>2026年7月12日 設大明簡易站<br>2026年7月12日 鐵路創世線通車經過大明站<br>2026年7月20日 改為關山車站" },
            "沙崙車站": { x: -275, z: 1334, info: "車站位置_-275 84 1334<br>所屬路線_鐵路創世線<br>車站編號_1030<br>車站等級_甲種簡易站<br>月台形式_岸壁式月台（側式月台）二座<br>上行車站_關山<br>下行車站_樺林<br>啟用日期_2026.7.16<br>車站歷史：<br>2026年7月16日 設沙崙簡易站<br>2026年7月16日 鐵路創世線通車經過沙崙站" },
            "樺林車站": { x: 8, z: 1374, info: "車站位置_8 66 1374<br>所屬路線_鐵路創世線<br>車站編號_1040<br>車站等級_三等站<br>月台形式_島式月台一座<br>上行車站_沙崙<br>下行車站_榮新<br>啟用日期_2026.7.23<br>車站歷史：<br>2026年7月23日 設樺林三等站<br>2026年7月23日 鐵路創世線通車經過樺林站" },
            "榮新車站": { x: 221, z: 1314, info: "車站位置_221 69 1314<br>所屬路線_鐵路創世線<br>車站編號_1050<br>車站等級_三等站<br>月台形式_島式月台一座<br>上行車站_樺林<br>下行車站_終末之地<br>啟用日期_2026.8.3<br>車站歷史：<br>2026年8月3日 設榮新三等站<br>2026年8月3日 鐵路創世線通車經過榮新站" },
            "終末之地車站": { x: 646, z: 1340, info: "車站位置_646 -35 1340<br>所屬路線_鐵路創世線<br>車站編號_1060<br>車站等級_一等站<br>月台形式_島式月台二座<br>上行車站_榮新<br>啟用日期_2026.7.18<br>車站歷史：<br>2026年7月18日 設終末之地一等站<br>2026年8月6日 鐵路創世線通車經過終末之地站" },
            "捷運珍奶站": { x: 391, z: -480, info: "車站位置_391 64 -480<br>所屬路線_捷運陳傑線<br>車站編號_R01<br>月台形式_島式月台一座<br>下行車站_創世車站<br>啟用日期_2026.8.18", isSubway: true },
            "捷運創世車站": { x: -510, z: -163, info: "車站位置_-510 65 -163<br>所屬路線_捷運陳傑線<br>車站編號_R02<br>月台形式_岸壁式月台（側式月台）二座<br>上行車站_珍奶<br>下行車站_中港<br>啟用日期_2026.8.18", isSubway: true },
            "捷運中港站": { x: -350, z: -616, info: "車站位置_-350 64 -616<br>所屬路線_捷運陳傑線<br>車站編號_R03<br>月台形式_島式月台一座<br>上行車站_創世車站<br>啟用日期_2026.8.18", isSubway: true }
        };

        const stationOrder = ["創世車站", "大洋車站", "關山車站", "沙崙車站", "樺林車站", "榮新車站", "終末之地車站"];
        const subwayOrder = ["捷運珍奶站", "捷運創世車站", "捷運中港站"];

        let activeStationName = ""; 
        let isSyncing = false;
        let hasLocated = false;

        function getCoords() {
            let x = parseFloat(document.getElementById("userX").value) || 0;
            let z = parseFloat(document.getElementById("userZ").value) || 0;
            if(document.getElementById("negX").checked) x *= -1;
            if(document.getElementById("negZ").checked) z *= -1;
            return { x, z };
        }

        function syncInputToCommand() {
            if (isSyncing) return;
            isSyncing = true;
            hasLocated = true;
            const { x, z } = getCoords();
            document.getElementById("commandInput").value = `/execute in minecraft:overworld run tp @s ${x} 64 ${z} 0 0`;
            isSyncing = false;
        }

        function parseCommandToInputs() {
            if (isSyncing) return;
            isSyncing = true;
            const cmd = document.getElementById("commandInput").value.trim();
            const numbers = cmd.match(/-?\d+(\.\d+)?/g);
            
            if (numbers && numbers.length >= 3) {
                hasLocated = true;
                const xVal = parseFloat(numbers[0]);
                const zVal = parseFloat(numbers[2]);

                if (!isNaN(xVal)) {
                    document.getElementById("negX").checked = xVal < 0;
                    document.getElementById("userX").value = Math.abs(xVal);
                }
                if (!isNaN(zVal)) {
                    document.getElementById("negZ").checked = zVal < 0;
                    document.getElementById("userZ").value = Math.abs(zVal);
                }
                calculateNearest();
            } else if (cmd === "") {
                hasLocated = false;
            }
            isSyncing = false;
        }

        function calculateNearest() {
            hasLocated = true;
            const { x, z } = getCoords();
            let minDistance = Infinity;
            for (let name in stations) {
                const s = stations[name];
                const realDist = Math.sqrt(Math.pow(x - s.x, 2) + Math.pow(z - s.z, 2));
                if (realDist < minDistance) {
                    minDistance = realDist;
                    activeStationName = name;
                }
            }
            document.getElementById("nearestName").innerHTML = activeStationName;
            document.getElementById("distDisplay").innerHTML = minDistance.toFixed(2);
            document.getElementById("detailsContent").innerHTML = stations[activeStationName].info;
        }

        const canvas = document.getElementById("mapCanvas");
        const ctx = canvas.getContext("2d");

        function drawMap() {
            const w = canvas.width = canvas.offsetWidth;
            const h = canvas.height = canvas.offsetHeight;
            const cx = w/2, cy = h/2, maxR = Math.min(cx, cy) - 40;
            ctx.fillStyle = "#030712";
            ctx.fillRect(0, 0, w, h);
            
            const scale = maxR / 2000;

            // 繪製無重力鐵路主線 (深藍色)
            ctx.strokeStyle = "#1e3a8a";
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (let i = 0; i < stationOrder.length; i++) {
                const s = stations[stationOrder[i]];
                const sx = cx + s.x * scale;
                const sy = cy + s.z * scale;
                if (i === 0) {
                    ctx.moveTo(sx, sy);
                } else {
                    ctx.lineTo(sx, sy);
                }
            }
            ctx.stroke();

            // 繪製捷運陳傑線 (紅色)
            ctx.strokeStyle = "#dc2626";
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (let i = 0; i < subwayOrder.length; i++) {
                const s = stations[subwayOrder[i]];
                const sx = cx + s.x * scale;
                const sy = cy + s.z * scale;
                if (i === 0) {
                    ctx.moveTo(sx, sy);
                } else {
                    ctx.lineTo(sx, sy);
                }
            }
            ctx.stroke();
            
            // 繪製所有車站點及名稱
            for (let name in stations) {
                const s = stations[name];
                const sx = cx + s.x * scale, sy = cy + s.z * scale;
                const isActive = (name === activeStationName);
                ctx.fillStyle = isActive ? "#c084fc" : "#ffffff";
                ctx.beginPath();
                ctx.arc(sx, sy, isActive ? 6 : 3.5, 0, Math.PI*2);
                ctx.fill();

                ctx.fillStyle = isActive ? "#c084fc" : "#e2e8f0";
                ctx.font = isActive ? "bold 12px 'Share Tech Mono'" : "10px 'Share Tech Mono'";
                
                if (name === "沙崙車站") {
                    ctx.textAlign = "right";
                    ctx.fillText(name, sx - 8, sy + 4);
                } else if (name === "樺林車站") {
                    ctx.textAlign = "center";
                    ctx.fillText(name, sx, sy + 16);
                } else if (name === "榮新車站") {
                    ctx.textAlign = "left";
                    ctx.fillText(name, sx + 10, sy - 4);
                } else if (name === "捷運創世車站") {
                    // 將捷運創世車站文字移到左側，避免與捷運珍奶站重疊
                    ctx.textAlign = "right";
                    ctx.fillText(name, sx - 8, sy + 4);
                } else {
                    ctx.textAlign = "left";
                    ctx.fillText(name, sx + 8, sy + 4);
                }
            }

            if (hasLocated) {
                const user = getCoords();
                const userSx = cx + user.x * scale;
                const userSy = cy + user.z * scale;
                
                ctx.fillStyle = "#ef4444"; 
                ctx.beginPath();
                ctx.arc(userSx, userSy, 7, 0, Math.PI*2);
                ctx.fill();

                ctx.strokeStyle = "rgba(239, 68, 68, 0.5)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(userSx, userSy, 11, 0, Math.PI*2);
                ctx.stroke();

                ctx.fillStyle = "#f87171";
                ctx.font = "bold 11px 'Share Tech Mono'";
                ctx.textAlign = "center";
                ctx.fillText("目前位置", userSx, userSy - 14);
            }

            requestAnimationFrame(drawMap);
        }

        canvas.addEventListener("click", e => {
            hasLocated = true;
            const rect = canvas.getBoundingClientRect();
            const scale = (Math.min(canvas.width, canvas.height) / 2 - 40) / 2000;
            let x = Math.round((e.clientX - rect.left - canvas.width / 2) / scale);
            let z = Math.round((e.clientY - rect.top - canvas.height / 2) / scale);
            
            isSyncing = true;
            if (x < 0) {
                document.getElementById("negX").checked = true;
                document.getElementById("userX").value = Math.abs(x);
            } else {
                document.getElementById("negX").checked = false;
                document.getElementById("userX").value = x;
            }

            if (z < 0) {
                document.getElementById("negZ").checked = true;
                document.getElementById("userZ").value = Math.abs(z);
            } else {
                document.getElementById("negZ").checked = false;
                document.getElementById("userZ").value = z;
            }

            document.getElementById("commandInput").value = `/execute in minecraft:overworld run tp @s ${x} 64 ${z} 0 0`;
            isSyncing = false;

            calculateNearest();
        });

        window.onload = function() {
            drawMap();
        };
    </script>
</body>
</html>
